# Token prices in USD per million tokens, used to cost every model call.
#
# These are list prices as published in October 2026. Providers change them;
# check the pricing pages before trusting a scorecard's cost column, and
# override this table with ROSTER_PRICING_FILE when they drift.
#
# cache_write is the five-minute cache write price. Tiers that depend on
# prompt length (long-context surcharges) are not modelled.
#
# A model named "*" prices every model of that provider.

anthropic:
  claude-fable-5-1:  {input: 10.00, output: 50.00, cache_read: 0.25, cache_write: 12.50}
  claude-opus-5-5:   {input: 4.00,  output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-opus-5:     {input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-opus-4-8:   {input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-sonnet-5-5: {input: 2.00,  output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-haiku-5-5:  {input: 0.10,  output: 0.50,  cache_read: 0.01, cache_write: 0.125}

openai:
  gpt-6.1-sol: {input: 2.00, output: 10.00, cache_read: 0.10}
  gpt-6-luna:  {input: 0.10, output: 0.50,  cache_read: 0.01}

xai:
  grok-4.7: {input: 2.00, output: 6.00, cache_read: 0.50}
  grok-4.3: {input: 1.25, output: 2.50, cache_read: 0.20}

# Self-hosted models cost compute, not tokens.
ollama:
  "*": {input: 0, output: 0}

# The scripted demo models are not models. A nominal price gives the cost
# columns something to show.
demo:
  "*": {input: 1.00, output: 5.00}
