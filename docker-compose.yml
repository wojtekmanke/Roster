services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: roster
      POSTGRES_PASSWORD: roster
      POSTGRES_DB: roster
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
